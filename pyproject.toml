[project]
name = "grid4earth"
requires-python = ">= 3.11"
license = "Apache-2.0"
dependencies = [
  "healpix-geo==0.4.1",
  "healpix-plot==2026.7.0",
  "healpix-analyse==2026.10.2",
  "healpix-resample==2026.11.2",
  "healpix-convert==2026.11.1",
]
dynamic = ["version"]

[build-system]
requires = ["setuptools>=80.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.setuptools_scm]

[tool.ruff]
builtins = ["ellipsis"]
exclude = [
  ".git",
  ".eggs",
  "build",
  "dist",
  "__pycache__",
  "docs",
]
target-version = "py313"

extend-include = ["*.ipynb"]
line-length = 100

[tool.ruff.lint]
select = [
  "F",   # Pyflakes
  "E",   # Pycodestyle
  "I",   # isort
  "UP",  # Pyupgrade
  "TID", # tidy imports
]
ignore = [
  "E402", # E402: module level import not at top of file
  "E501", # E501: line too long - let black worry about that
  "E731", # E731: do not assign a lambda expression, use a def
]
fixable = ["I", "TID252"]
extend-safe-fixes = [
  "TID252", # absolute imports
]


[tool.ruff.lint.isort]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
